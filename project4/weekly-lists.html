<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prep & Chef — Weekly Ingredient List</title>
  <meta name="description" content="Generate a weekly ingredient list for all your planned meals with Prep & Chef.">
  <meta name="keywords" content="weekly ingredient list, meal prep, shopping list, ingredients">
  <meta name="author" content="Prep & Chef">
  <link rel="icon" href="favicon_io/favicon.ico">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous">
</head>
<body>
<!-- Header -->
<div id="header-placeholder"></div>
  
<main class="container">
  <h1>Weekly Ingredient List Generator</h1>
  <p>Select the meals you plan to cook this week, then generate your ingredient list.</p>

  <section>
    <h2>Select Meals</h2>
    <label><input type="checkbox" name="meal" value="Garlic Chicken Bowls"> Garlic Chicken Bowls</label><br>
    <label><input type="checkbox" name="meal" value="Chicken Caesar Pasta"> Chicken Caesar Pasta</label><br>
    <label><input type="checkbox" name="meal" value="Pesto Pasta"> Pesto Pasta</label><br>
    <label><input type="checkbox" name="meal" value="Veggie Fried Rice"> Veggie Fried Rice</label><br>
    <label><input type="checkbox" name="meal" value="Beef Stir-Fry"> Beef Stir-Fry</label><br>
    <label><input type="checkbox" name="meal" value="Lentil Soup"> Lentil Soup</label><br>

    <button class="btn btn-primary" type="button" onclick="generateList()">Generate Ingredient List</button>
  </section>

  <section>
    <h2>Your Ingredient List</h2>
    <ul id="ingredientOutput"></ul>
  </section>
</main>

<!-- Footer -->
<div id="footer-placeholder"></div>

<!-- Scripts -->
<script src="js/scripts.js"></script>
<script>
  // Load header/footer partials
  ['header', 'footer'].forEach(part => {
    fetch(`${part}.html`)
      .then(resp => resp.text())
      .then(html => {
        const placeholder = document.getElementById(`${part}-placeholder`);
        if(placeholder) placeholder.innerHTML = html;
      })
      .catch(err => console.error(`Error loading ${part}.html:`, err));
  });

  // Mobile Nav Toggle
  function initNavToggle() {
    const navToggle = document.querySelector('.nav-toggle');
    const nav = document.getElementById('main-menu');
    if(navToggle && nav) {
      navToggle.addEventListener('click', () => {
        const expanded = navToggle.getAttribute('aria-expanded') === 'true';
        navToggle.setAttribute('aria-expanded', !expanded);
        nav.classList.toggle('nav-open');
      });
    }
  }
  document.addEventListener('DOMContentLoaded', initNavToggle);

  // Footer datetime
  function setFooterDate() {
    const datetime = document.getElementById('datetime');
    if(datetime) datetime.textContent = new Date().toLocaleString();
  }
  document.addEventListener('DOMContentLoaded', setFooterDate);

  // Ingredient list generator
  const mealIngredients = {
    "Garlic Chicken Bowls": ["Chicken breasts", "Garlic", "Lemon", "Olive oil", "Salt", "Pepper"],
    "Chicken Caesar Pasta": ["Chicken breasts", "Pasta", "Parmesan", "Caesar dressing", "Lettuce"],
    "Pesto Pasta": ["Pasta", "Pesto sauce", "Zucchini", "Cherry tomatoes", "Parmesan"],
    "Veggie Fried Rice": ["Rice", "Carrots", "Peas", "Soy sauce", "Eggs", "Green onions"],
    "Beef Stir-Fry": ["Beef strips", "Soy sauce", "Bell peppers", "Onion", "Garlic"],
    "Lentil Soup": ["Lentils", "Carrots", "Celery", "Onion", "Garlic", "Vegetable broth"]
  };

  function generateList() {
    const checkedMeals = Array.from(document.querySelectorAll('input[name="meal"]:checked')).map(i => i.value);
    const ingredientsSet = new Set();
    checkedMeals.forEach(meal => {
      if(mealIngredients[meal]) {
        mealIngredients[meal].forEach(item => ingredientsSet.add(item));
      }
    });

    const output = document.getElementById('ingredientOutput');
    output.innerHTML = '';
    if(ingredientsSet.size === 0) {
      output.innerHTML = '<li>No meals selected.</li>';
      return;
    }
    Array.from(ingredientsSet).sort().forEach(item => {
      const li = document.createElement('li');
      li.textContent = item;
      output.appendChild(li);
    });
  }
</script>
</body>
</html>
